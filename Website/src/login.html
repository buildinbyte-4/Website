<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — BuildInByte</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg:#050810;
  --bg-alt:#080c17;
  --panel:rgba(255,255,255,0.03);
  --panel-border:rgba(255,255,255,0.08);
  --cyan:#3ee8ff;
  --blue:#4d7cff;
  --violet:#7c5cff;
  --text:#eef2f9;
  --text-dim:#8b93a7;
  --text-dimmer:#5a6178;
  --danger:#ff5d6c;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow:hidden;
  position:relative;
}
h1,h2,h3,.font-display{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em;}
.mono{font-family:'JetBrains Mono',monospace;}

/* ---------- Background layers ---------- */
.grid-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 90% 80% at 50% 50%, black 20%, transparent 80%);
}
.glow-a{
  position:fixed;top:-20%;left:-10%;width:60vw;height:60vw;border-radius:50%;
  background:radial-gradient(circle, rgba(62,232,255,0.10), transparent 65%);
  filter:blur(40px);z-index:0;animation:drift1 18s ease-in-out infinite;
}
.glow-b{
  position:fixed;bottom:-25%;right:-10%;width:55vw;height:55vw;border-radius:50%;
  background:radial-gradient(circle, rgba(124,92,255,0.10), transparent 65%);
  filter:blur(40px);z-index:0;animation:drift2 22s ease-in-out infinite;
}
@keyframes drift1{0%,100%{transform:translate(0,0);}50%{transform:translate(4%,6%);}}
@keyframes drift2{0%,100%{transform:translate(0,0);}50%{transform:translate(-5%,-4%);}}

/* Converging circuit lines toward center */
.circuit-svg{position:fixed;inset:0;z-index:0;width:100%;height:100%;opacity:0.35;}
.circuit-svg path{
  fill:none;stroke:url(#circGrad);stroke-width:1;
  stroke-dasharray:6 8;
  animation:dashflow 3s linear infinite;
}
@keyframes dashflow{to{stroke-dashoffset:-140;}}

/* ---------- Floating software/hardware panels ---------- */
.panel-field{position:fixed;inset:0;z-index:1;pointer-events:none;}
.float-panel{
  position:absolute;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:12px;
  backdrop-filter:blur(10px);
  padding:14px 16px;
  font-family:'JetBrains Mono';
  font-size:0.72rem;
  color:var(--text-dimmer);
  box-shadow:0 20px 60px rgba(0,0,0,0.35);
  animation-name:floaty;
  animation-timing-function:ease-in-out;
  animation-iteration-count:infinite;
  opacity:0;
}
.float-panel .fp-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--text-dim);font-size:0.68rem;}
.float-panel .fp-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan);}
.float-panel .fp-line{height:4px;border-radius:2px;background:linear-gradient(90deg, rgba(62,232,255,0.35), rgba(62,232,255,0.05));margin-bottom:5px;}
.float-panel .fp-line:nth-child(2){width:80%;}
.float-panel .fp-line:nth-child(3){width:55%;}
.float-panel .fp-graph{display:flex;align-items:flex-end;gap:3px;height:26px;margin-top:8px;}
.float-panel .fp-bar{flex:1;background:linear-gradient(180deg, var(--cyan), rgba(62,232,255,0.15));border-radius:2px 2px 0 0;}

@keyframes floaty{
  0%{transform:translateY(0px) translateX(0px) rotate(var(--rot,0deg));}
  50%{transform:translateY(-18px) translateX(6px) rotate(var(--rot,0deg));}
  100%{transform:translateY(0px) translateX(0px) rotate(var(--rot,0deg));}
}
.fade-in-panel{animation-name:fadeInPanel, floaty; animation-duration:1.2s, 8s; animation-fill-mode:forwards, none; animation-iteration-count:1, infinite; animation-delay:var(--delay,0s), var(--delay,0s);}
@keyframes fadeInPanel{to{opacity:1;}}

@media (max-width:900px){ .float-panel{display:none;} }

/* ---------- Login card ---------- */
.stage{
  position:relative;z-index:5;height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.login-card{
  width:100%;max-width:400px;
  background:rgba(8,12,23,0.75);
  border:1px solid var(--panel-border);
  border-radius:20px;
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  padding:44px 36px 36px;
  position:relative;
  box-shadow:0 30px 100px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.02);
  opacity:0;
  transform:translateY(24px) scale(0.98);
  animation:cardIn 0.9s cubic-bezier(.2,.8,.2,1) 0.3s forwards;
}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}
.login-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
  background:linear-gradient(140deg, rgba(62,232,255,0.35), transparent 40%, transparent 60%, rgba(124,92,255,0.25));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}

.login-logo{display:flex;align-items:center;gap:9px;justify-content:center;margin-bottom:8px;}
.login-logo .mark{
  width:34px;height:34px;border-radius:9px;position:relative;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  box-shadow:0 0 24px rgba(62,232,255,0.35);
}
.login-logo .mark::before{content:'';position:absolute;inset:6px;border:1.5px solid rgba(5,8,16,0.7);border-radius:4px;}
.login-logo span.name{font-family:'Space Grotesk';font-weight:700;font-size:1.2rem;}
.login-logo span.name b{color:var(--cyan);font-weight:700;}

.login-sub{text-align:center;color:var(--text-dimmer);font-size:0.85rem;margin-bottom:30px;}
.login-sub .poc-tag{
  display:inline-block;margin-top:10px;padding:4px 12px;border-radius:100px;
  background:rgba(255,93,108,0.08);border:1px solid rgba(255,93,108,0.25);
  color:var(--danger);font-family:'JetBrains Mono';font-size:0.68rem;letter-spacing:0.05em;text-transform:uppercase;
}

.field{margin-bottom:18px;position:relative;}
.field label{display:block;font-size:0.75rem;color:var(--text-dim);margin-bottom:8px;font-weight:500;}
.field .input-wrap{position:relative;}
.field input{
  width:100%;padding:13px 16px 13px 42px;border-radius:10px;
  background:rgba(255,255,255,0.03);border:1px solid var(--panel-border);
  color:var(--text);font-family:'Inter';font-size:0.92rem;outline:none;
  transition:border-color .3s, background .3s, box-shadow .3s;
}
.field input:focus{border-color:var(--cyan);background:rgba(62,232,255,0.04);box-shadow:0 0 0 3px rgba(62,232,255,0.08);}
.field .field-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-dimmer);
  display:flex;transition:color .3s;
}
.field input:focus ~ .field-icon, .field .input-wrap:focus-within .field-icon{color:var(--cyan);}
.field .toggle-pw{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-dimmer);
  cursor:pointer;display:flex;background:none;border:none;padding:0;
}
.field .toggle-pw:hover{color:var(--text-dim);}

.login-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:0.8rem;}
.remember{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
.remember input{accent-color:var(--cyan);}
.login-row a{color:var(--text-dimmer);text-decoration:none;transition:color .3s;}
.login-row a:hover{color:var(--cyan);}

.btn-login{
  width:100%;padding:14px;border-radius:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--cyan));color:#02060f;
  font-weight:600;font-size:0.95rem;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s ease;
  position:relative;overflow:hidden;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 34px rgba(62,232,255,0.35);}
.btn-login:active{transform:translateY(0);}
.btn-login.loading{color:transparent;pointer-events:none;}
.btn-login .spinner{
  position:absolute;top:50%;left:50%;width:18px;height:18px;margin:-9px 0 0 -9px;
  border:2px solid rgba(2,6,15,0.25);border-top-color:#02060f;border-radius:50%;
  opacity:0;animation:none;
}
.btn-login.loading .spinner{opacity:1;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.error-msg{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,93,108,0.08);border:1px solid rgba(255,93,108,0.3);
  color:var(--danger);font-size:0.82rem;padding:11px 14px;border-radius:10px;
  margin-bottom:18px;opacity:0;max-height:0;overflow:hidden;transition:all .35s ease;
}
.error-msg.show{opacity:1;max-height:60px;margin-bottom:18px;}

.shake{animation:shakeAnim 0.5s cubic-bezier(.36,.07,.19,.97);}
@keyframes shakeAnim{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}

.hint-box{
  margin-top:22px;padding:12px 14px;border-radius:10px;
  background:rgba(62,232,255,0.05);border:1px dashed rgba(62,232,255,0.25);
  font-family:'JetBrains Mono';font-size:0.74rem;color:var(--text-dim);
  display:flex;justify-content:space-between;align-items:center;
}
.hint-box b{color:var(--cyan);}

.back-link{
  position:fixed;top:26px;left:26px;z-index:10;display:flex;align-items:center;gap:8px;
  color:var(--text-dim);text-decoration:none;font-size:0.85rem;font-weight:500;
  padding:9px 16px;border-radius:100px;border:1px solid var(--panel-border);
  background:rgba(255,255,255,0.03);backdrop-filter:blur(10px);
  transition:all .3s ease;
}
.back-link:hover{border-color:var(--cyan);color:var(--cyan);transform:translateX(-2px);}

/* success overlay */
#success-overlay{
  position:fixed;inset:0;z-index:100;background:var(--bg);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
  opacity:0;visibility:hidden;transition:opacity .5s ease, visibility .5s ease;
}
#success-overlay.show{opacity:1;visibility:visible;}
.success-ring{
  width:70px;height:70px;border-radius:50%;border:2px solid rgba(62,232,255,0.25);
  display:flex;align-items:center;justify-content:center;color:var(--cyan);
  box-shadow:0 0 40px rgba(62,232,255,0.25);
  animation:pop 0.5s cubic-bezier(.2,.8,.2,1);
}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.1);}100%{transform:scale(1);}}
#success-overlay p{color:var(--text-dim);font-family:'JetBrains Mono';font-size:0.85rem;}
#success-overlay .prog{width:180px;height:2px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
#success-overlay .prog::after{content:'';display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));animation:fillbar 1.1s ease forwards;}
@keyframes fillbar{to{width:100%;}}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
}
</style>
</head>
<body>

<div class="glow-a"></div>
<div class="glow-b"></div>
<div class="grid-overlay"></div>

<svg class="circuit-svg" id="circuit-svg">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ee8ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3ee8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>

<div class="panel-field" id="panel-field"></div>

<a href="index.html" class="back-link"><span data-lucide="arrow-left" style="width:14px;height:14px;"></span> Back to site</a>

<div class="stage">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark"></div>
      <span class="name">Build<b>In</b>Byte</span>
    </div>
    <div class="login-sub">
      Internal console access
      <div class="poc-tag">Proof of concept — not production auth</div>
    </div>

    <div class="error-msg" id="error-msg">
      <span data-lucide="alert-triangle" style="width:15px;height:15px;flex-shrink:0;"></span>
      <span id="error-text">Invalid username or password.</span>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label>Username</label>
        <div class="input-wrap">
          <input type="text" id="username" placeholder="admin" autocomplete="username" required>
          <span class="field-icon" data-lucide="user" style="width:16px;height:16px;"></span>
        </div>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <span class="field-icon" data-lucide="lock" style="width:16px;height:16px;"></span>
          <button type="button" class="toggle-pw" id="toggle-pw" tabindex="-1">
            <span data-lucide="eye" style="width:16px;height:16px;"></span>
          </button>
        </div>
      </div>
      <div class="login-row">
        <label class="remember"><input type="checkbox"> Remember me</label>
        <a href="#" onclick="return false;">Forgot password?</a>
      </div>
      <button type="submit" class="btn-login" id="btn-login">
        <span class="btn-text">Sign In</span>
        <span data-lucide="arrow-right" style="width:15px;height:15px;" class="btn-text"></span>
        <span class="spinner"></span>
      </button>
    </form>

    <div class="hint-box">
      <span>POC credentials</span>
      <span><b>admin</b> / <b>admin</b></span>
    </div>
  </div>
</div>

<div id="success-overlay">
  <div class="success-ring"><span data-lucide="check" style="width:28px;height:28px;"></span></div>
  <p>Access granted — loading console…</p>
  <div class="prog"></div>
</div>

<script>
lucide.createIcons();

/* ---------- Floating panels ---------- */
const panelTemplates = [
  {w:170,h:110,graph:true},
  {w:150,h:90,graph:false},
  {w:180,h:100,graph:true},
  {w:140,h:80,graph:false},
  {w:160,h:100,graph:true},
  {w:150,h:85,graph:false}
];
const positions = [
  {top:'8%',  left:'6%',  rot:-6, delay:0.1, dur:9},
  {top:'62%', left:'4%',  rot:4,  delay:0.5, dur:10},
  {top:'14%', left:'80%', rot:5,  delay:0.3, dur:8.5},
  {top:'68%', left:'82%', rot:-4, delay:0.7, dur:9.5},
  {top:'38%', left:'2%',  rot:-3, delay:0.9, dur:11},
  {top:'40%', left:'86%', rot:3,  delay:1.1, dur:10.5}
];
const field = document.getElementById('panel-field');
positions.forEach((pos,i)=>{
  const tpl = panelTemplates[i % panelTemplates.length];
  const el = document.createElement('div');
  el.className = 'float-panel fade-in-panel';
  el.style.top = pos.top; el.style.left = pos.left;
  el.style.width = tpl.w+'px';
  el.style.setProperty('--rot', pos.rot+'deg');
  el.style.setProperty('--delay', pos.delay+'s');
  el.style.animationDuration = '1.2s, '+pos.dur+'s';
  let inner = `<div class="fp-head"><span class="fp-dot"></span>${['module.sys','firmware.bin','build.log','api.status','sensor.io','deploy.ok'][i%6]}</div>
    <div class="fp-line"></div><div class="fp-line"></div><div class="fp-line"></div>`;
  if(tpl.graph){
    let bars = '';
    for(let b=0;b<8;b++){ bars += `<div class="fp-bar" style="height:${20+Math.random()*80}%"></div>`; }
    inner += `<div class="fp-graph">${bars}</div>`;
  }
  el.innerHTML = inner;
  field.appendChild(el);
});

/* ---------- Circuit lines converging toward center ---------- */
(function(){
  const svg = document.getElementById('circuit-svg');
  const w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  const cx = w/2, cy = h/2;
  const starts = [
    [w*0.08,h*0.15],[w*0.05,h*0.7],[w*0.92,h*0.2],[w*0.95,h*0.75],
    [w*0.15,h*0.92],[w*0.85,h*0.9],[w*0.02,h*0.4],[w*0.98,h*0.45]
  ];
  starts.forEach(([sx,sy])=>{
    const midX = sx + (cx-sx)*0.5;
    const midY = sy;
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', `M${sx},${sy} L${midX},${midY} L${midX},${cy} L${cx},${cy}`);
    svg.appendChild(path);
  });
})();

/* ---------- Login logic (POC hardcoded) ---------- */
const form = document.getElementById('login-form');
const btn = document.getElementById('btn-login');
const errorBox = document.getElementById('error-msg');
const card = document.querySelector('.login-card');
const togglePw = document.getElementById('toggle-pw');
const pwInput = document.getElementById('password');

togglePw.addEventListener('click', ()=>{
  const isPw = pwInput.type === 'password';
  pwInput.type = isPw ? 'text' : 'password';
  togglePw.innerHTML = `<span data-lucide="${isPw ? 'eye-off' : 'eye'}" style="width:16px;height:16px;"></span>`;
  lucide.createIcons();
});

form.addEventListener('submit', (e)=>{
  e.preventDefault();
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value;

  errorBox.classList.remove('show');
  btn.classList.add('loading');

  setTimeout(()=>{
    if(user === 'admin' && pass === 'admin'){
      document.getElementById('success-overlay').classList.add('show');
      setTimeout(()=>{ window.location.href = 'index.html'; }, 1200);
    } else {
      btn.classList.remove('loading');
      errorBox.classList.add('show');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  }, 700);
});
</script>
</body>
</html>
